<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Human Check — детектор человека</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    min-height: 100vh;
    background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 100%);
    color: #e2e8f0;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 24px 16px;
  }

  header {
    text-align: center;
    margin: 20px 0 32px;
  }

  .logo {
    display: inline-flex;
    align-items: center;
    gap: 10px;
    font-size: 20px;
    font-weight: 800;
    letter-spacing: -0.02em;
    background: rgba(255,255,255,0.08);
    border: 1px solid rgba(255,255,255,0.12);
    padding: 10px 22px;
    border-radius: 999px;
    margin-bottom: 16px;
  }

  .logo .dot {
    width: 10px; height: 10px; border-radius: 50%;
    background: #34d399;
    box-shadow: 0 0 12px #34d399;
  }

  h1 { font-size: 28px; font-weight: 800; }
  h1 span { color: #a5b4fc; }
  .sub { color: #94a3b8; margin-top: 8px; font-size: 14px; }

  .app {
    width: 100%;
    max-width: 980px;
    display: grid;
    grid-template-columns: 1fr 320px;
    gap: 16px;
    flex: 1;
    align-self: stretch;
    margin: 0 auto;
  }

  .panel {
    background: rgba(255,255,255,0.05);
    border: 1px solid rgba(255,255,255,0.10);
    border-radius: 20px;
    padding: 20px;
    backdrop-filter: blur(8px);
  }

  .panel h2 {
    font-size: 13px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: #94a3b8;
    margin-bottom: 14px;
  }

  textarea {
    width: 100%;
    min-height: 320px;
    resize: vertical;
    background: rgba(15,23,42,0.6);
    border: 1px solid rgba(255,255,255,0.12);
    border-radius: 14px;
    color: #f1f5f9;
    font-size: 15px;
    line-height: 1.6;
    padding: 16px;
    outline: none;
    transition: border-color 0.2s;
  }

  textarea:focus { border-color: #6366f1; }
  textarea::placeholder { color: #64748b; }

  .footer-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-top: 12px;
  }

  .chars { font-size: 12px; color: #64748b; }

  .btn {
    background: #6366f1;
    border: none;
    color: #fff;
    font-weight: 700;
    font-size: 13px;
    padding: 10px 18px;
    border-radius: 10px;
    cursor: pointer;
    transition: background 0.2s, transform 0.1s;
  }
  .btn:hover { background: #4f46e5; }
  .btn:active { transform: scale(0.97); }
  .btn.ghost {
    background: transparent;
    border: 1px solid rgba(255,255,255,0.2);
  }
  .btn.ghost:hover { background: rgba(255,255,255,0.08); }

  .result-panel {
    display: flex;
    flex-direction: column;
  }

  .verdict {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 10px 0;
  }

  .percent {
    font-size: 88px;
    font-weight: 900;
    letter-spacing: -0.04em;
    line-height: 1;
    background: linear-gradient(135deg, #34d399, #10b981);
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
    opacity: 0;
    transform: scale(0.6);
    transition: all 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
  }

  .percent.show {
    opacity: 1;
    transform: scale(1);
  }

  .verdict-label {
    margin-top: 14px;
    font-size: 18px;
    font-weight: 800;
    color: #f1f5f9;
    opacity: 0;
    transform: translateY(8px);
    transition: all 0.4s ease 0.1s;
  }
  .verdict-label.show { opacity: 1; transform: translateY(0); }

  .verdict-sub {
    margin-top: 8px;
    font-size: 13px;
    color: #94a3b8;
    opacity: 0;
    transition: opacity 0.4s ease 0.2s;
  }
  .verdict-sub.show { opacity: 1; }

  .meter {
    margin-top: 20px;
    height: 10px;
    border-radius: 999px;
    background: rgba(255,255,255,0.08);
    overflow: hidden;
  }
  .meter .fill {
    height: 100%;
    width: 0%;
    border-radius: 999px;
    background: linear-gradient(90deg, #10b981, #34d399);
    transition: width 0.9s cubic-bezier(0.22, 1, 0.36, 1);
    box-shadow: 0 0 16px rgba(52,211,153,0.5);
  }

  .placeholder {
    color: #64748b;
    font-size: 14px;
    line-height: 1.5;
  }
  .placeholder b { color: #94a3b8; }

  footer {
    margin-top: 28px;
    font-size: 12px;
    color: #475569;
  }

  .banner {
    margin-top: 16px;
    width: 100%;
    max-width: 980px;
    text-align: center;
    background: rgba(52,211,153,0.1);
    border: 1px solid rgba(52,211,153,0.25);
    color: #6ee7b7;
    font-size: 13px;
    font-weight: 600;
    border-radius: 12px;
    padding: 10px;
    display: none;
  }

  @media (max-width: 720px) {
    .app { grid-template-columns: 1fr; }
    textarea { min-height: 180px; }
    .percent { font-size: 64px; }
  }
</style>
</head>
<body>
  <header>
    <div class="logo"><span class="dot"></span> Human Check</div>
    <h1>Проверь, <span>человек</span> ли это</h1>
    <p class="sub">Вставь любой текст — и узнай правду</p>
  </header>

  <div class="app">
    <section class="panel">
      <h2>Ваш текст</h2>
      <textarea id="text" placeholder="Вставьте текст сюда…"></textarea>
      <div class="footer-row">
        <span class="chars" id="chars">0 символов</span>
        <div style="display:flex; gap:8px">
          <button class="btn ghost" onclick="document.getElementById('text').value=''; onInput();">Очистить</button>
          <button class="btn" onclick="check()">Проверить</button>
        </div>
      </div>
    </section>

    <section class="panel result-panel">
      <h2>Результат</h2>
      <div class="verdict">
        <div class="percent" id="percent">100%</div>
        <div class="verdict-label" id="label">человек</div>
        <div class="verdict-sub" id="sub">Анализ завершён</div>
        <div class="meter"><div class="fill" id="fill"></div></div>
      </div>
    </section>
  </div>

  <div class="banner" id="banner"></div>

  <footer>Human Check © 2026 — точнейший детектор человечности</footer>

<script>
  let timer = null;

  function onInput() {
    const t = document.getElementById('text').value;
    document.getElementById('chars').textContent = `${t.length} символов`;
  }

  function check() {
    const t = document.getElementById('text').value.trim();
    const banner = document.getElementById('banner');
    banner.style.display = 'none';

    if (!t) {
      banner.textContent = 'Вставь текст сначала';
      banner.style.display = 'block';
      return;
    }

    const percent = document.getElementById('percent');
    const label = document.getElementById('label');
    const sub = document.getElementById('sub');
    const fill = document.getElementById('fill');

    // плавная анимация «анализа»
    percent.classList.remove('show');
    label.classList.remove('show');
    sub.classList.remove('show');

    setTimeout(() => {
      percent.textContent = '100%';
      label.textContent = 'человек';
      sub.textContent = `«${t.slice(0, 42)}${t.length > 42 ? '…' : ''}» — чисто человеческое`;
      fill.style.width = '100%';
      percent.classList.add('show');
      label.classList.add('show');
      sub.classList.add('show');
    }, 350);
  }

  document.getElementById('text').addEventListener('input', onInput);
  document.getElementById('text').addEventListener('focus', (e) => e.target.select());
</script>
</body>
</html>
